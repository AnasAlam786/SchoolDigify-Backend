{% extends "base.html" %}
{% block title %}Show Marks - SchoolDigify{% endblock %}
{% block content %}

<style>
  /* Custom Styles */
  .checkbox-ui {
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .student-checkbox:checked+.checkbox-ui {
    background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
    border-color: #3b82f6;
    transform: scale(1.1);
  }

  .student-checkbox:checked+.checkbox-ui .check-icon {
    display: block;
    animation: checkmark 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  @keyframes checkmark {
    from {
      transform: scale(0);
      opacity: 0;
    }

    to {
      transform: scale(1);
      opacity: 1;
    }
  }

  /* Table row hover effect */
  tbody tr {
    transition: background-color 0.2s ease;
  }

  tbody tr:hover {
    background-color: rgba(55, 65, 81, 0.3) !important;
  }

  /* Smooth scroll for table */
  .overflow-x-auto {
    scrollbar-width: thin;
    scrollbar-color: rgba(75, 85, 99, 0.5) transparent;
  }

  .overflow-x-auto::-webkit-scrollbar {
    height: 8px;
  }

  .overflow-x-auto::-webkit-scrollbar-track {
    background: transparent;
    border-radius: 4px;
  }

  .overflow-x-auto::-webkit-scrollbar-thumb {
    background: rgba(75, 85, 99, 0.5);
    border-radius: 4px;
  }

  .overflow-x-auto::-webkit-scrollbar-thumb:hover {
    background: rgba(75, 85, 99, 0.7);
  }

  /* Gradient borders */
  .gradient-border {
    position: relative;
    background: linear-gradient(135deg, rgba(59, 130, 246, 0.1), rgba(139, 92, 246, 0.1));
  }

  .gradient-border::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 0.75rem;
    padding: 1px;
    background: linear-gradient(135deg, #3b82f6, #8b5cf6);
    mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }

  /* ========================================
     MARKSHEET TABLE COLUMN TYPE STYLING
     ======================================== */

  /* Grand Total Column - Most Prominent */
  th:has(i.fa-crown),
  td:has(svg)+td+td+td {
    background: linear-gradient(180deg, rgba(217, 119, 6, 0.3) 0%, rgba(180, 83, 9, 0.2) 100%) !important;
  }

  /* Add visual glow/shadow effect to Grand Total columns on hover */
  tbody tr:hover td:has(+ *) {
    box-shadow: inset 0 0 12px rgba(217, 119, 6, 0.2);
  }

  /* Term Total / Summary Columns - Medium Prominence */
  th:has(i.fa-sum) {
    box-shadow: inset 0 1px 0 rgba(20, 184, 166, 0.4);
  }

  /* Regular Exam Columns - Standard */
  th:not(:has(i))~th:not(:has(i)):not(:has(i.fa-crown)):not(:has(i.fa-sum)) {
    border-bottom: 1px solid rgba(59, 130, 246, 0.3);
  }

  /* Column separation lines for better visual distinction */
  table th:nth-child(n+3) {
    border-left: 1px solid rgba(100, 116, 139, 0.2);
  }

  table td:nth-child(n+3) {
    border-left: 1px solid rgba(100, 116, 139, 0.15);
  }

  /* Enhance Grand Total column visibility with subtle glow */
  thead th:has(i.fa-crown) {
    box-shadow:
      inset 0 0 20px rgba(217, 119, 6, 0.3),
      0 0 15px rgba(217, 119, 6, 0.2);
    border-bottom: 2px solid rgba(217, 119, 6, 0.8) !important;
  }

  /* Summary row styling improvements */
  tbody tr:nth-last-child(2) {
    border-top: 2px solid rgba(217, 119, 6, 0.6) !important;
  }

  tbody tr:nth-last-child(1) {
    border-top: 1px solid rgba(59, 130, 246, 0.4) !important;
  }
</style>


<!-- START: Main Container -->
<div class="mx-auto">

<!-- Page Header -->
<div class="mb-10">
  <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-6">
    
    <div>
      <h1 class="text-3xl md:text-4xl font-bold tracking-tight text-white">
        View Marksheet
      </h1>
      <p class="mt-3 text-gray-400 text-sm md:text-base max-w-xl leading-relaxed">
        Search, filter, and download student marksheets efficiently.
      </p>
    </div>

  </div>
</div>


<!-- Search + Filter Section -->
<div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-10">

  <!-- Search Box -->
  <div class="lg:col-span-2">
    <div class="group relative rounded-2xl bg-white/[0.04] border border-white/10 backdrop-blur-xl transition-all duration-300 focus-within:border-blue-500/50 focus-within:ring-2 focus-within:ring-blue-500/20">

      <div class="flex items-center px-5 py-4">
        <i class="fas fa-search text-gray-500 group-focus-within:text-blue-400 transition"></i>

        <input
          type="text"
          id="search-input"
          oninput="searchFunction()"
          placeholder="Search by Name, Father's Name or Roll Number"
          class="ml-4 w-full bg-transparent text-white placeholder-gray-500 focus:outline-none text-sm md:text-base"
        >
      </div>

    </div>
  </div>


  <!-- Class Dropdown -->
  <div class="relative">
    <div class="group relative rounded-2xl bg-white/[0.04] border border-white/10 backdrop-blur-xl transition-all duration-300 focus-within:border-blue-500/50 focus-within:ring-2 focus-within:ring-blue-500/20">
      
      <select
        id="classView"
        name="selectClass"
        onchange="loadMarksheets(this.value)"
        class="w-full appearance-none bg-transparent px-5 py-4 pr-12 text-gray-200 text-sm md:text-base focus:outline-none cursor-pointer">

        <option value="" selected disabled hidden style="background:#111111; color:#e5e7eb;">
          Select Class
        </option>

        {% if classes %}
          {% for class in classes %}
            <option value="{{ class.id }}" style="background:#111111; color:#e5e7eb;">
              {{ class.CLASS }}
            </option>
          {% endfor %}
        {% endif %}
      </select>

      <i class="fas fa-chevron-down absolute right-5 top-1/2 -translate-y-1/2 text-gray-500 pointer-events-none group-focus-within:text-blue-400 transition"></i>

    </div>
  </div>

</div>



{% if has_permission('get_result') %}
<!-- Premium Bulk Action Bar -->
<div id="bulk-selection-bar"

  backdrop-blur-2xl shadow-[0_10px_40px_rgba(0,0,0,0.5)]">

  <div class="flex flex-col lg:flex-row items-stretch lg:items-center justify-between gap-6 p-4 sm:p-6">

    <!-- Left Section -->
    <div class="flex flex-wrap items-center gap-4 w-full lg:w-auto justify-between sm:justify-start">

      <!-- Checkbox -->

        <input type="checkbox" id="select-all" onchange="toggleSelectAll()"
          class="w-5 h-5 rounded-lg border border-gray-600 bg-gray-800 text-blue-500 focus:ring-2 focus:ring-blue-500/40">

        <span class="text-sm sm:text-base text-gray-300 group-hover:text-white">
          Select All
        </span>
      </label>

      <!-- Count Badge -->
      <div class="px-3 py-1.5 rounded-xl bg-black/30 border border-white/10">
        <span id="selected-count" class="text-sm font-semibold text-gray-300">
          0 selected
        </span>
      </div>

    </div>

    <!-- Right Section -->
    <div class="flex flex-col sm:flex-row gap-3 w-full lg:w-auto">

      <!-- Clear -->
      <button onclick="clearSelection()"
        class="w-full sm:w-auto px-4 py-2.5 rounded-xl border border-white/10 
        text-gray-400 hover:text-white hover:bg-white/5 text-sm font-medium">
        Clear
      </button>

      <!-- Download -->
      <button id="bulk-download-btn" disabled onclick="bulkDownload()"
        class="w-full sm:w-auto flex items-center justify-center gap-2 sm:gap-3 
        px-4 sm:px-6 py-2.5 sm:py-3 rounded-xl text-sm font-semibold 
        bg-gradient-to-r from-blue-600 to-indigo-600 
        hover:from-blue-500 hover:to-indigo-500 
        shadow-lg hover:shadow-blue-500/20
        disabled:opacity-40 disabled:cursor-not-allowed">

        <i class="fas fa-download"></i>
        <span>Download</span>

        <span id="download-count"
          class="px-2 py-0.5 rounded-lg bg-white/20 text-xs font-bold min-w-[26px] text-center">
          0
        </span>
      </button>

      <!-- Print -->
      <button id="bulk-certificate-btn" disabled onclick="bulkPrintCertificates()"
        class="w-full sm:w-auto flex items-center justify-center gap-2 sm:gap-3 
        px-4 sm:px-6 py-2.5 sm:py-3 rounded-xl text-sm font-semibold 
        bg-gradient-to-r from-amber-500 to-orange-500 
        hover:from-amber-400 hover:to-orange-400 
        shadow-lg hover:shadow-amber-400/20
        disabled:opacity-40 disabled:cursor-not-allowed">

        <i class="fas fa-certificate"></i>
        <span class="truncate">Print Certificates</span>
      </button>

    </div>

  </div>
</div>
{% endif %}

  <!-- START: Results Container -->
  <div id="results-container">

  </div>
  <!-- END: Results Container -->
</div>

<script>
  // Global variables
  let currentClassId = null;
  let currentSelection = new Set();
  let isLoading = false;

  // Initialize on page load
  document.addEventListener('DOMContentLoaded', function () {
    // Initialize search functionality
    const searchInput = document.getElementById('search-input');
    if (searchInput) {
      searchInput.addEventListener('input', debounce(searchFunction, 300));
    }

    // Initialize bulk selection bar
    updateBulkSelectionBar();

    // Add click handlers for custom checkboxes
    document.addEventListener('click', function (e) {
      const checkboxUI = e.target.closest('.checkbox-ui');
      if (checkboxUI) {
        const checkbox = checkboxUI.previousElementSibling;
        if (checkbox && checkbox.classList.contains('student-checkbox')) {
          checkbox.checked = !checkbox.checked;
          checkbox.dispatchEvent(new Event('change'));
        }
      }
    });
  });

  // START: Load Marksheets Function
  async function loadMarksheets(classId) {
    if (!classId || isLoading) return;

    isLoading = true;
    currentClassId = classId;

    // Clear current selection
    currentSelection.clear();
    updateBulkSelectionBar();

    // Get results container
    const resultsContainer = document.getElementById('results-container');
    if (!resultsContainer) return;

    // Show skeleton loader
    const skeletonTemplate = document.getElementById('skeleton-template');
    const skeletonClone = skeletonTemplate.content.cloneNode(true);
    resultsContainer.innerHTML = '';
    resultsContainer.appendChild(skeletonClone);

    try {
      // Fetch marks data
      const response = await fetch('/show_marks_api', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ class_id: classId })
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.message || 'Failed to load marksheets. Please try again.');
      }

      resultsContainer.innerHTML = data.html;

      // Re-initialize checkboxes
      setTimeout(() => {
        const checkboxes = document.querySelectorAll('.student-checkbox');
        checkboxes.forEach(cb => {
          cb.checked = currentSelection.has(parseInt(cb.value));
          // Update event listener
          cb.onchange = updateBulkSelection;
        });
        updateBulkSelection();
      }, 100);
    } catch (error) {
      console.error('Failed to load marksheets:', error);
      showError(error);

      // Show error state
      resultsContainer.innerHTML = `
        <div class="text-center py-16">
          <div class="inline-block p-8 bg-red-900/20 rounded-3xl border border-red-700/30 mb-8 backdrop-blur-sm">
            <i class="fas fa-exclamation-triangle text-5xl text-red-500"></i>
          </div>
          <h3 class="text-2xl font-bold text-white mb-4">Error Loading Data</h3>
          <p class="text-gray-400 text-lg max-w-md mx-auto mb-8">
            ${error.message || 'Unable to load marksheets. Please try again.'}
          </p>
          <button onclick="loadMarksheets('${classId}')" 
                  class="px-6 py-3 bg-gradient-to-r from-red-600 to-pink-600 hover:from-red-700 hover:to-pink-700 text-white rounded-xl font-medium flex items-center justify-center gap-3 transition-all duration-200 mx-auto">
            <i class="fas fa-redo"></i>
            Retry Loading
          </button>
        </div>
      `;
    } finally {
      isLoading = false;
    }
  }
  // END: Load Marksheets Function

  // START: getResult function
  async function getResult(id, classId) {
    if (!id || !classId) return;

    try {
      const response = await fetch('/get_result_api', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: id, class_id: classId }),
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.message || 'Failed to fetch result');
      }

      const { html } = data;
      const printWindow = window.open('', '_blank');
      printWindow.document.write(html);
      printWindow.document.close();

      // Add a small delay to ensure content is loaded
      setTimeout(() => {
        printWindow.focus();
        printWindow.print();
      }, 500);

    } catch (err) {
      showError('Failed to generate result: ' + err.message);
      console.error('Error printing result:', err);
    }
  }
  // END: getResult function

  // START: Print Certificate function
  async function printCertificate(studentId, rank, percentage) {
    if (!studentId) {
      showError('Student ID is required to print certificate.');
      return;
    }

    let selectedStudents = [{
          student_id: parseInt(studentId, 10),
          rank: rank,
          percentage: percentage,
        }];

    try {
      const response = await fetch('/print_certificate_api', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ students: selectedStudents }),
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.message || 'Failed to generate certificate');
      }

      const printWindow = window.open('', '_blank');
      printWindow.document.write(data.html);
      printWindow.document.close();

      setTimeout(() => {
        printWindow.focus();
        printWindow.print();
      }, 500);

    } catch (err) {
      showError('Failed to generate certificate: ' + err.message);
      console.error('Error printing certificate:', err);
    }
  }
  // END: Print Certificate function

  // START: Bulk Selection Functions
  function updateBulkSelection() {
    const checkboxes = document.querySelectorAll('.student-checkbox');
    currentSelection.clear();

    checkboxes.forEach(cb => {
      if (cb.checked) {
        currentSelection.add(parseInt(cb.value));
      }
    });

    updateBulkSelectionBar();
  }

  function toggleSelectAll() {
    const selectAll = document.getElementById('select-all');
    const checkboxes = document.querySelectorAll('.student-checkbox');

    if (!selectAll) return;

    checkboxes.forEach(cb => {
      cb.checked = selectAll.checked;
    });

    if (selectAll.checked) {
      checkboxes.forEach(cb => {
        currentSelection.add(parseInt(cb.value));
      });
    } else {
      currentSelection.clear();
    }

    updateBulkSelectionBar();
  }

  function updateBulkSelectionBar() {
    const bar = document.getElementById('bulk-selection-bar');
    const selectedCount = document.getElementById('selected-count');
    const downloadCount = document.getElementById('download-count');
    const bulkBtn = document.getElementById('bulk-download-btn');
    const selectAll = document.getElementById('select-all');

    if (!bar || !selectedCount) return;

    const count = currentSelection.size;

    // Update counts
    selectedCount.textContent = `${count} selected`;
    downloadCount.textContent = count;

    // Update select all checkbox
    if (selectAll) {
      const totalCheckboxes = document.querySelectorAll('.student-checkbox').length;
      selectAll.checked = count > 0 && count === totalCheckboxes;
      selectAll.indeterminate = count > 0 && count < totalCheckboxes;
    }

    // Update bulk download button
    if (bulkBtn) {
      bulkBtn.disabled = count === 0;
      if (count === 0) {
        bulkBtn.title = 'Select at least one student to download';
      } else {
        bulkBtn.title = `Download ${count} marksheet${count > 1 ? 's' : ''}`;
      }
    }

    const bulkCertificateBtn = document.getElementById('bulk-certificate-btn');
    if (bulkCertificateBtn) {
      bulkCertificateBtn.disabled = count === 0;
      if (count === 0) {
        bulkCertificateBtn.title = 'Select at least one student to print certificates';
      } else {
        bulkCertificateBtn.title = `Print certificates for ${count} student${count > 1 ? 's' : ''}`;
      }
    }

    // Animate selection bar on change
    if (count > 0) {
      bar.classList.add('border-blue-500/30');
    } else {
      bar.classList.remove('border-blue-500/30');
    }
  }

  function clearSelection() {
    currentSelection.clear();
    const checkboxes = document.querySelectorAll('.student-checkbox');
    checkboxes.forEach(cb => cb.checked = false);

    const selectAll = document.getElementById('select-all');
    if (selectAll) {
      selectAll.checked = false;
      selectAll.indeterminate = false;
    }

    updateBulkSelectionBar();
  }
  // END: Bulk Selection Functions

  // START: Bulk Download
  async function bulkDownload() {
    if (currentSelection.size === 0 || !currentClassId) {
      showError('Please select at least one student to download');
      return;
    }

    const studentIds = Array.from(currentSelection);
    const bulkBtn = document.getElementById('bulk-download-btn');
    const originalHTML = bulkBtn.innerHTML;

    try {
      // Loading state
      bulkBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';
      bulkBtn.disabled = true;

      const response = await fetch('/bulk_download_results', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          student_ids: studentIds,
          class_id: parseInt(currentClassId)
        }),
      });

      if (!response.ok) {
        const data = await response.json();
        throw new Error(data.message || 'Failed to generate results');
      }

      const data = await response.json();

      const newWindow = window.open('', '_blank');
      console.log(data.html);
      newWindow.document.open();
      newWindow.document.write(data.html);

      newWindow.document.close();

      // Wait for full load (HTML + CSS + fonts + images)
      newWindow.onload = async () => {
        const images = Array.from(newWindow.document.images);

        await Promise.all(
          images.map(img =>
            img.complete
              ? Promise.resolve()
              : new Promise(resolve => {
                img.onload = img.onerror = resolve;
              })
          )
        );

        newWindow.focus();
        newWindow.print();

        // Reset button
        bulkBtn.innerHTML = originalHTML;
        bulkBtn.disabled = false;
      };

    } catch (err) {
      console.error('Bulk download error:', err);
      showError(err.message || 'Error generating bulk results');

      bulkBtn.innerHTML = '<i class="fas fa-download"></i> Download Selected';
      bulkBtn.disabled = currentSelection.size === 0;
    }
  }

  async function bulkPrintCertificates() {
    if (currentSelection.size === 0) {
      showError('Please select at least one student to print certificates');
      return;
    }

    const printBtn = document.getElementById('bulk-certificate-btn');
    const origHTML = printBtn ? printBtn.innerHTML : 'Print Certificates';

    try {
      if (printBtn) {
        printBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';
        printBtn.disabled = true;
      }


      const selectedStudents = Array.from(currentSelection).map(studentId => {
        const card = document.querySelector(`.marks-card[data-student-id="${studentId}"]`);
        return {
          student_id: studentId,
          rank: card?.dataset.rank,
          percentage: card?.dataset.percentage,
        };
      });

      const response = await fetch('/bulk_print_certificate_api', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ students: selectedStudents })
      });

      if (!response.ok) {
        const err = await response.json();
        throw new Error(err.message || 'Failed to create bulk certificates');
      }

      const data = await response.json();
      const win = window.open('', '_blank');
      win.document.open();
      win.document.write(data.html);
      win.document.close();

      win.onload = () => {
        win.focus();
        win.print();
      };

    } catch (err) {
      console.error('Bulk certificate error:', err);
      showError(err.message || 'Error generating bulk certificates');

    } finally {
      if (printBtn) {
        printBtn.innerHTML = origHTML;
        printBtn.disabled = currentSelection.size === 0;
      }
    }
  }

  // START: Search Function with Debounce
  function debounce(func, wait) {
    let timeout;
    return function executedFunction(...args) {
      const later = () => {
        clearTimeout(timeout);
        func(...args);
      };
      clearTimeout(timeout);
      timeout = setTimeout(later, wait);
    };
  }

  function searchFunction() {
    const inputEl = document.getElementById("search-input");
    const input = inputEl.value.toLowerCase().trim();
    const cards = Array.from(document.querySelectorAll(".marks-card"));

    let visibleCount = 0;
    let hasResults = false;

    cards.forEach(card => {
      const name = card.querySelector("h3")?.innerText.toLowerCase() || "";
      const father = card.querySelector("p.text-gray-400")?.innerText.toLowerCase() || "";
      const rollElement = card.querySelector(".bg-gradient-to-r.from-gray-800\\/50");
      const roll = rollElement ? rollElement.querySelector("p.font-semibold")?.innerText.toLowerCase() : "";

      const isMatch = name.includes(input) ||
        father.includes(input) ||
        roll.includes(input) ||
        input === "";

      if (isMatch) {
        card.style.display = "block";
        visibleCount++;
        hasResults = true;

        // Highlight search terms
        if (input) {
          highlightText(card, input);
        }
      } else {
        card.style.display = "none";
      }
    });

    // Show/hide no results message
    const resultsContainer = document.getElementById("results");
    if (!resultsContainer) return;

    let emptyMessage = document.getElementById("no-results-message");

    if (!hasResults && input !== "") {
      if (!emptyMessage) {
        emptyMessage = document.createElement('div');
        emptyMessage.id = 'no-results-message';
        emptyMessage.className = 'text-center py-16';
        emptyMessage.innerHTML = `
          <div class="inline-block p-8 bg-gray-800/30 rounded-3xl border border-gray-700/30 mb-8">
            <i class="fas fa-search text-5xl text-gray-600"></i>
          </div>
          <h3 class="text-2xl font-bold text-white mb-4">No matching results</h3>
          <p class="text-gray-400 text-lg mb-8">No students found matching "<span class="text-blue-300">${input}</span>"</p>
          <button onclick="clearSearch()" 
                  class="px-6 py-3 bg-gray-700/50 hover:bg-gray-600/50 text-gray-300 rounded-xl font-medium flex items-center justify-center gap-3 transition-all duration-200 border border-gray-700/50 mx-auto">
            <i class="fas fa-times"></i>
            Clear Search
          </button>
        `;
        resultsContainer.parentNode.insertBefore(emptyMessage, resultsContainer.nextSibling);
      }
    } else {
      if (emptyMessage) {
        emptyMessage.remove();
      }
    }
  }

  function highlightText(element, searchTerm) {
    // Remove previous highlights
    const highlights = element.querySelectorAll('.search-highlight');
    highlights.forEach(h => {
      const parent = h.parentNode;
      parent.replaceChild(document.createTextNode(h.textContent), h);
      parent.normalize();
    });

    // Highlight text in headings
    const headings = element.querySelectorAll('h3, p.text-gray-400, .font-semibold');
    headings.forEach(heading => {
      const text = heading.textContent;
      const regex = new RegExp(`(${searchTerm})`, 'gi');
      const newText = text.replace(regex, '<span class="search-highlight bg-yellow-500/20 text-yellow-300 px-1 rounded">$1</span>');

      if (newText !== text) {
        heading.innerHTML = newText;
      }
    });
  }

  function clearSearch() {
    const inputEl = document.getElementById("search-input");
    inputEl.value = "";
    searchFunction();
    inputEl.focus();
  }
  // END: Search Function

  // START: Helper Functions
  function showError(message) {
    // Create error toast
    const toast = document.createElement('div');
    toast.className = 'fixed top-4 right-4 z-50 bg-red-600 text-white px-6 py-4 rounded-xl shadow-xl border border-red-700 transform transition-transform duration-300 translate-x-full';
    toast.innerHTML = `
      <div class="flex items-center gap-3">
        <i class="fas fa-exclamation-circle text-xl"></i>
        <div>
          <p class="font-medium">${message}</p>
          <p class="text-red-200 text-sm mt-1">Please try again</p>
        </div>
        <button onclick="this.parentElement.parentElement.remove()" class="ml-4 text-red-200 hover:text-white">
          <i class="fas fa-times"></i>
        </button>
      </div>
    `;

    document.body.appendChild(toast);

    // Animate in
    setTimeout(() => {
      toast.classList.remove('translate-x-full');
    }, 10);

    // Auto remove after 5 seconds
    setTimeout(() => {
      toast.classList.add('translate-x-full');
      setTimeout(() => toast.remove(), 300);
    }, 5000);
  }

</script>
